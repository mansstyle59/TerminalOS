<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TerminalOS</title>
  <desc id="desc">Icône de terminal sombre avec trois boutons de fenêtre et une invite de commande vert néon.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f7fa"/><stop offset=".42" stop-color="#68717c"/><stop offset=".72" stop-color="#161c22"/><stop offset="1" stop-color="#31ffd1"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#252b33"/><stop offset=".55" stop-color="#080b0f"/><stop offset="1" stop-color="#010303"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b8ffd0"/><stop offset=".38" stop-color="#25ff9a"/><stop offset="1" stop-color="#00bd79"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff8a86"/><stop offset="1" stop-color="#ff302f"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff29b"/><stop offset="1" stop-color="#ffb800"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9dff9d"/><stop offset="1" stop-color="#00c853"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="5"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="windowClip"><rect x="44" y="44" width="424" height="332" rx="48"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="96" fill="#030506"/>
  <g filter="url(#softShadow)">
    <rect x="40" y="40" width="432" height="340" rx="52" fill="#050708" stroke="url(#frame)" stroke-width="4"/>
    <g clip-path="url(#windowClip)">
      <rect x="44" y="44" width="424" height="332" rx="48" fill="url(#pane)"/>
      <path d="M44 92 Q44 44 92 44 H420 L44 330Z" fill="#fff" opacity=".035"/>
      <path d="M44 122 H468" stroke="#5b6670" stroke-width="2" opacity=".65"/>
      <path d="M44 125 H468" stroke="#000" stroke-width="2"/>
    </g>
    <circle cx="82" cy="82" r="14" fill="url(#red)" stroke="#ffb0ab" stroke-width="1.5"/>
    <circle cx="124" cy="82" r="14" fill="url(#yellow)" stroke="#fff0a6" stroke-width="1.5"/>
    <circle cx="166" cy="82" r="14" fill="url(#lime)" stroke="#b4ffb4" stroke-width="1.5"/>
    <g filter="url(#glow)" fill="none" stroke="url(#green)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M142 180 L211 235 L142 290" stroke-width="19"/>
      <path d="M241 290 H345" stroke-width="19"/>
    </g>
    <path d="M142 180 L211 235 L142 290" fill="none" stroke="#e0ffe9" stroke-opacity=".8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M241 290 H345" fill="none" stroke="#c5ffe2" stroke-opacity=".85" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="51" font-weight="750" letter-spacing="-2">
    <tspan fill="#f3f5f7">Terminal</tspan><tspan fill="#25f99b">OS</tspan>
  </text>
</svg>